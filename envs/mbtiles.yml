name: mbtiles
channels:
  - conda-forge
channel_priority: strict
dependencies:
  # tomllib needs Python 3.11 or newer.
  - python=3.12
  - gdal
  - geopandas
  - hdf5
  - libnetcdf
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - pyogrio
  - pyproj
  - rasterio
  - requests
  - scipy
  - pip
  - pip:
      - rio-mbtiles
      - boto3
      - botocore